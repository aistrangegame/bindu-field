// ── MAP CANVAS ─────────────────────────────────────────────────────────
function MapCanvas({ chakras, selected, onSelect, showNames, t }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const phaseRef = useRef(0);

  const draw = useCallback((phase) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = canvas.width / dpr;
    const H = canvas.height / dpr;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W * dpr, H * dpr);

    // ─ Draw connections ─────────────────────────────────────────────
    CONNECTIONS.forEach(([aId, bId]) => {
      const a = chakras.find(c => c.id === aId);
      const b = chakras.find(c => c.id === bId);
      if (!a || !b) return;
      const aLit = a.state !== 'locked';
      const bLit = b.state !== 'locked';
      const bothLit = aLit && bLit;
      const eitherLit = aLit || bLit;

      const opacity = bothLit ? 0.18 : eitherLit ? 0.09 : 0.045;
      const lineWidth = bothLit ? 0.7 : 0.5;

      ctx.save();
      if (bothLit) {
        // subtle element-blended gradient
        const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        grad.addColorStop(0, `hsla(${a.hue},50%,65%,${opacity})`);
        grad.addColorStop(1, `hsla(${b.hue},50%,65%,${opacity})`);
        ctx.strokeStyle = grad;
      } else {
        ctx.strokeStyle = `rgba(245,226,214,${opacity})`;
      }
      ctx.lineWidth = lineWidth;

      // gentle curve — midpoint offset
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.sqrt(dx * dx + dy * dy);
      const curvature = Math.min(len * 0.12, 18);
      const nx = -dy / len * curvature;
      const ny = dx / len * curvature;

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(mx + nx, my + ny, b.x, b.y);
      ctx.stroke();
      ctx.restore();
    });

    // ─ Draw nodes ───────────────────────────────────────────────────
    chakras.forEach(chakra => {
      const { x, y, state, hue, id, tier } = chakra;
      const isSelected = selected === id;
      const isDanced = state === 'danced';
      const isAvailable = state === 'available';
      const isLit = isDanced || isAvailable;

      ctx.save();

      if (isLit) {
        const breathe = 0.6 + 0.4 * Math.sin(phase * (isDanced ? 0.8 : 1.1) + (x + y) * 0.005);
        const baseR = isDanced ? 11 : 9;
        const r = baseR;

        // outer aura
        const auraR = isSelected ? r * 3.5 : r * 2.8;
        const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, auraR);
        const auraAlpha = isDanced ? 0.28 * breathe : 0.2 * breathe;
        glowGrad.addColorStop(0, `hsla(${hue},60%,68%,${auraAlpha})`);
        glowGrad.addColorStop(0.4, `hsla(${hue},55%,65%,${auraAlpha * 0.5})`);
        glowGrad.addColorStop(1, `hsla(${hue},50%,62%,0)`);
        ctx.beginPath();
        ctx.arc(x, y, auraR, 0, Math.PI * 2);
        ctx.fillStyle = glowGrad;
        ctx.fill();

        // danced ring
        if (isDanced) {
          ctx.beginPath();
          ctx.arc(x, y, r + 5 + breathe * 2, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${hue},55%,68%,${0.25 * breathe})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
          // second orbit ring
          ctx.beginPath();
          ctx.arc(x, y, r + 9 + breathe, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${hue},50%,65%,${0.12 * breathe})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }

        // selection highlight
        if (isSelected) {
          ctx.beginPath();
          ctx.arc(x, y, r + 7, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${hue},65%,75%,0.55)`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // core dot
        const dotGrad = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, 0, x, y, r);
        dotGrad.addColorStop(0, `hsla(${hue},70%,82%,1)`);
        dotGrad.addColorStop(0.5, `hsla(${hue},60%,70%,1)`);
        dotGrad.addColorStop(1, `hsla(${hue},55%,58%,1)`);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = dotGrad;
        ctx.fill();

        // inner shine
        ctx.beginPath();
        ctx.arc(x - r * 0.28, y - r * 0.28, r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,0.25)`;
        ctx.fill();

      } else {
        // locked node — very small dim cream dot
        const lockR = tier === 2 ? 2.8 : tier === 3 ? 2.2 : 2.5;
        ctx.beginPath();
        ctx.arc(x, y, lockR, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(245,226,214,0.18)';
        ctx.fill();
      }

      ctx.restore();
    });

    // ─ Node labels for composed chakras ────────────────────────────
    if (showNames) {
      chakras.forEach(chakra => {
        const { x, y, name, state, id, tier } = chakra;
        if (state === 'locked') return;
        const isDanced = state === 'danced';
        const isSelected = selected === id;
        const baseR = isDanced ? 11 : 9;
        const labelY = y + baseR + 14;

        ctx.save();
        ctx.font = `300 8.5px ${MONO}`;
        ctx.letterSpacing = '0.18em';
        ctx.textAlign = 'center';
        ctx.fillStyle = isSelected
          ? `hsla(${chakra.hue},60%,78%,0.95)`
          : isDanced
            ? `hsla(${chakra.hue},55%,72%,0.75)`
            : `hsla(${chakra.hue},50%,70%,0.58)`;
        ctx.fillText(name.toUpperCase(), x, labelY);
        ctx.restore();
      });
    }

    // ─ System zone faint labels ─────────────────────────────────────
    ctx.save();
    ctx.font = `300 7px ${MONO}`;
    ctx.letterSpacing = '0.22em';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(245,226,214,0.10)';
    ctx.fillText('ENERGY', 8, 364);
    ctx.fillText('TREE · BODY', 8, 462);
    ctx.restore();

  }, [chakras, selected, showNames]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = 393 * dpr;
    canvas.height = 780 * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
  }, []);

  useEffect(() => {
    let frame = 0;
    const animate = () => {
      frame++;
      phaseRef.current = frame * 0.022;
      draw(phaseRef.current);
      animRef.current = requestAnimationFrame(animate);
    };
    animRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(animRef.current);
  }, [draw]);

  // Hit areas
  const handleClick = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = 393 / rect.width;
    const scaleY = 780 / rect.height;
    const px = (e.clientX - rect.left) * scaleX;
    const py = (e.clientY - rect.top) * scaleY;

    let closest = null;
    let closestDist = Infinity;
    chakras.forEach(c => {
      const dist = Math.sqrt((c.x - px) ** 2 + (c.y - py) ** 2);
      const hitR = c.state !== 'locked' ? 22 : 10;
      if (dist < hitR && dist < closestDist) {
        closest = c;
        closestDist = dist;
      }
    });
    if (closest) onSelect(closest.id === selected ? null : closest.id);
  };

  return (
    <canvas
      ref={canvasRef}
      onClick={handleClick}
      style={{ width: '100%', height: '100%', cursor: 'crosshair', display: 'block' }}
    />
  );
}

// ── SYSTEM TAG ─────────────────────────────────────────────────────────

  return (
    <span style={{
      fontFamily: MONO, fontSize: 8, letterSpacing: '0.2em',
      color: colors[sys] || SUBTLE, fontWeight: 300,
    }}>{labels[sys] || sys.toUpperCase()}</span>
  );
}

// ── CHAKRA DETAIL CARD ─────────────────────────────────────────────────
function ChakraCard({ chakra, onClose, onEnter }) {
  if (!chakra) return null;
  const { name, sys, hue, state, essence, skt } = chakra;
  const isDanced = state === 'danced';
  const isAvailable = state === 'available';
  const isLocked = state === 'locked';
  const accentColor = elColor(hue, 55, 70);
  const accentFaint = elColor(hue, 50, 65, 0.12);
  const accentBorder = elColor(hue, 50, 60, 0.25);

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 40,
      display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
      animation: 'fadeIn 0.2s ease',
    }} onClick={onClose}>
      {/* backdrop */}
      <div style={{
        position: 'absolute', inset: 0,
        background: 'linear-gradient(to top, rgba(2,2,8,0.92) 0%, rgba(2,2,8,0.3) 60%, transparent 100%)',
      }} />

      {/* card */}
      <div
        onClick={e => e.stopPropagation()}
        style={{
          position: 'relative', zIndex: 2,
          margin: '0 0 34px',
          padding: '28px 28px 32px',
          background: `rgba(12,10,18,0.95)`,
          borderTop: `1px solid ${accentBorder}`,
          animation: 'cardUp 0.35s cubic-bezier(0.16,1,0.3,1)',
        }}
      >
        {/* top row */}
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20 }}>
          <div>
            <div style={{ marginBottom:6 }}>
              <SystemTag sys={sys} />
            </div>
            <div style={{
              fontFamily: SERIF, fontStyle:'italic', fontWeight:300,
              fontSize:28, color: CREAM, lineHeight:1.1, letterSpacing:'-0.01em',
            }}>{name}</div>
            <div style={{
              fontFamily: MONO, fontWeight:300, fontSize:12,
              color: elColor(hue, 45, 68, 0.7), marginTop:5, letterSpacing:'0.04em',
            }}>{skt}</div>
          </div>
          {/* state indicator */}
          <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4 }}>
            {isDanced && (
              <div style={{
                fontFamily: MONO, fontSize:7.5, letterSpacing:'0.2em',
                color: elColor(hue, 55, 72, 0.85),
                background: elColor(hue, 50, 60, 0.12),
                border: `1px solid ${accentBorder}`,
                padding:'4px 10px', borderRadius:2,
              }}>DANCED</div>
            )}
            {isAvailable && (
              <div style={{
                fontFamily: MONO, fontSize:7.5, letterSpacing:'0.2em',
                color: SUBTLE, border: `1px solid ${BORDER}`,
                padding:'4px 10px', borderRadius:2,
              }}>AVAILABLE</div>
            )}
            {isLocked && (
              <div style={{
                fontFamily: MONO, fontSize:7.5, letterSpacing:'0.2em',
                color: 'rgba(245,226,214,0.2)', border: `1px solid rgba(255,255,255,0.05)`,
                padding:'4px 10px', borderRadius:2,
              }}>NOT YET</div>
            )}
          </div>
        </div>

        {/* divider */}
        <div style={{ height:1, background:`linear-gradient(to right, ${accentBorder}, transparent)`, marginBottom:20 }} />

        {/* essence */}
        <div style={{
          fontFamily: SERIF, fontStyle:'italic', fontWeight:300,
          fontSize:15, color: MUTED, lineHeight:1.6, marginBottom:24,
        }}>{essence}</div>

        {/* CTA */}
        {(isDanced || isAvailable) && (
          <button
            onClick={onEnter}
            style={{
              width:'100%', padding:'16px 24px',
              background: isDanced ? elColor(hue, 45, 18, 0.8) : 'transparent',
              border: `1px solid ${accentBorder}`,
              borderRadius:0,
              fontFamily: MONO, fontSize:10, letterSpacing:'0.22em',
              color: isDanced ? elColor(hue, 55, 76) : elColor(hue, 50, 70, 0.8),
              cursor:'pointer',
              animation: 'enterButton 0.4s 0.15s both',
              transition: 'background 0.2s, border-color 0.2s',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = elColor(hue, 45, 22, 0.9); e.currentTarget.style.borderColor = elColor(hue, 55, 65, 0.45); }}
            onMouseLeave={e => { e.currentTarget.style.background = isDanced ? elColor(hue, 45, 18, 0.8) : 'transparent'; e.currentTarget.style.borderColor = accentBorder; }}
          >
            {isDanced ? 'DANCE AGAIN' : 'ENTER THIS DANCE'}
          </button>
        )}
        {isLocked && (
          <div style={{
            padding:'14px 24px',
            border:`1px solid rgba(255,255,255,0.05)`,
            fontFamily: MONO, fontSize:9.5, letterSpacing:'0.18em',
            color:'rgba(245,226,214,0.18)', textAlign:'center',
          }}>
            THIS DANCE HAS NOT YET BEEN COMPOSED
          </div>
        )}
      </div>
    </div>
  );
}

// ── JOURNEY STAT ───────────────────────────────────────────────────────
function JourneyStat({ danced, total }) {
  const pct = total > 0 ? danced / total : 0;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
      <div style={{ flex:1, height:1, background:'rgba(255,255,255,0.06)', position:'relative' }}>
        <div style={{
          position:'absolute', left:0, top:0, height:'100%',
          width:`${pct * 100}%`,
          background:'rgba(245,226,214,0.25)',
          transition:'width 0.6s ease',
        }} />
      </div>
      <div style={{
        fontFamily: MONO, fontSize:9, letterSpacing:'0.18em',
        color:'rgba(245,226,214,0.35)', whiteSpace:'nowrap',
      }}>{danced}/{total}</div>
    </div>
  );
}

// ── ROOT MAP APP ───────────────────────────────────────────────────────
function MapApp({ journey, showNames }) {
  const [selected, setSelected] = useState(null);
  const [enterAnim, setEnterAnim] = useState(null);

  const preset = JOURNEY_PRESETS[journey] || JOURNEY_PRESETS.student;

  // build live chakra data from journey preset
  const COMPOSED = ['sahasrara','ajna','vishuddha','anahata','manipura','svadhisthana','muladhara','maya','aatma'];
  const chakras = useMemo(() => CHAKRAS.map(c => {
    if (preset.danced.includes(c.id)) return { ...c, state:'danced' };
    if (COMPOSED.includes(c.id)) return { ...c, state:'available' };
    return { ...c, state:'locked' };
  }), [journey]);

  const selectedChakra = selected ? chakras.find(c => c.id === selected) : null;
  const dancedCount = chakras.filter(c => c.state === 'danced').length;
  const composedCount = COMPOSED.length;

  const handleEnter = () => {
    if (!selectedChakra) return;
    setEnterAnim(selectedChakra.id);
    setTimeout(() => setEnterAnim(null), 1200);
  };

  return (
    <div style={{
      width:'100%', height:'100%',
      background: BG,
      display:'flex', flexDirection:'column',
      position:'relative', overflow:'hidden',
    }}>
      {/* ambient radial — breathes from heart center */}
      <div style={{
        position:'absolute', inset:0, pointerEvents:'none',
        background:`radial-gradient(ellipse 65% 55% at 50% 47%, rgba(195,90,60,0.04) 0%, transparent 70%)`,
      }} />

      {/* header */}
      <div style={{
        padding:'18px 24px 0',
        display:'flex', alignItems:'center', justifyContent:'space-between',
        position:'relative', zIndex:10,
      }}>
        <div>
          <div style={{
            fontFamily: MONO, fontSize:8.5, letterSpacing:'0.28em',
            color:'rgba(245,226,214,0.3)', marginBottom:3,
          }}>THE MAP</div>
          <div style={{
            fontFamily: SERIF, fontStyle:'italic', fontWeight:300,
            fontSize:14, color:'rgba(245,226,214,0.5)',
          }}>33 Chakras · Tree of Life</div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{
            fontFamily: MONO, fontSize:8, letterSpacing:'0.2em',
            color:'rgba(245,226,214,0.25)', marginBottom:4,
          }}>YOUR JOURNEY</div>
          <div style={{ width:100 }}>
            <JourneyStat danced={dancedCount} total={composedCount} />
          </div>
        </div>
      </div>

      {/* map canvas */}
      <div style={{ flex:1, position:'relative', overflow:'hidden' }}>
        <MapCanvas
          chakras={chakras}
          selected={selected}
          onSelect={setSelected}
          showNames={showNames}
          t={Date.now()}
        />
        <ChakraCard
          chakra={selectedChakra}
          onClose={() => setSelected(null)}
          onEnter={handleEnter}
        />
        {/* enter flash */}
        {enterAnim && (
          <div style={{
            position:'absolute', inset:0, pointerEvents:'none',
            background: selectedChakra ? elColor(selectedChakra.hue, 45, 20, 0.35) : 'transparent',
            animation:'fadeIn 0.3s ease, fadeIn 0.3s 0.9s reverse forwards',
          }} />
        )}
      </div>

      {/* tab bar hint */}
      <div style={{
        height:1, background:'rgba(255,255,255,0.05)', marginBottom:0,
      }} />
      <div style={{
        height:50, display:'flex', alignItems:'center', justifyContent:'space-around',
        padding:'0 8px',
        background:'rgba(2,2,8,0.96)',
        borderTop:'1px solid rgba(255,255,255,0.06)',
      }}>
        {[
          { label:'MAP', active:true, icon:'◉' },
          { label:'FIELD', active:false, icon:'⊙' },
          { label:'ORACLE', active:false, icon:'◌' },
          { label:'SPACE', active:false, icon:'◎' },
          { label:'LAB', active:false, icon:'⊡' },
        ].map(tab => (
          <div key={tab.label} style={{
            display:'flex', flexDirection:'column', alignItems:'center', gap:3,
            opacity: tab.active ? 1 : 0.35,
          }}>
            <div style={{
              fontFamily: MONO, fontSize:11,
              color: tab.active ? CREAM : 'rgba(245,226,214,0.5)',
              lineHeight:1,
            }}>{tab.icon}</div>
            <div style={{
              fontFamily: MONO, fontSize:7, letterSpacing:'0.16em',
              color: tab.active ? 'rgba(245,226,214,0.7)' : 'rgba(245,226,214,0.3)',
            }}>{tab.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontFamily:MONO, fontSize:8, letterSpacing:'0.2em', color:'rgba(245,226,214,0.25)', marginBottom:4 }}>YOUR JOURNEY</div>
          <div style={{ width:100 }}><JourneyStat danced={dancedCount} total={9} /></div>
        </div>
      </div>
      <div style={{ flex:1, position:'relative', height:'calc(100% - 60px - 51px)' }}>
        <MapCanvas chakras={chakras} selected={selected} onSelect={setSelected} showNames={true} t={0} />
        <ChakraCard chakra={selectedChakra} onClose={() => setSelected(null)} onEnter={() => {}} />

      <div style={{ height:1, background:'rgba(255,255,255,0.05)' }} />
      <div style={{ height:50, display:'flex', alignItems:'center', justifyContent:'space-around', padding:'0 8px', background:'rgba(2,2,8,0.96)', borderTop:'1px solid rgba(255,255,255,0.06)' }}>
